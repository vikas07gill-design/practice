<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>TaxChinta | Contact</title>
  <link rel="stylesheet" href="styles.css" />

<body class="page-contact">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">taxchinta</a>
      <nav class="nav-links">
        <a data-nav href="index.html">Home</a>

  <main class="section">
    <div class="container grid-2">
      <section class="card">
        <h1>Contact TaxChinta</h1>

          <div class="form-group"><label>Message</label><textarea placeholder="Tell us your features"></textarea></div>
          <button class="btn btn-primary" type="submit">Send</button>

      </section>
    </div>
